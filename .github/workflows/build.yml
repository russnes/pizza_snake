name: Build Pizza Snake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install pillow

      - name: Download and install pvsneslib
        run: |
          curl -L -o pvsneslib.zip \
            https://github.com/alekmaul/pvsneslib/releases/download/4.3.0/pvsneslib_430_64b_linux_release.zip
          mkdir -p pvsneslib_install
          unzip -q pvsneslib.zip -d pvsneslib_install
          chmod +x pvsneslib_install/pvsneslib/devkitsnes/bin/*
          chmod +x pvsneslib_install/pvsneslib/devkitsnes/tools/*
          ls -la pvsneslib_install/pvsneslib/devkitsnes/bin/
          test -f pvsneslib_install/pvsneslib/devkitsnes/snes_rules

      - name: Build ROM (with optimizer)
        id: build
        continue-on-error: true
        env:
          PVSNESLIB_HOME: ${{ github.workspace }}/pvsneslib_install/pvsneslib
        run: |
          export PATH="$PATH:$PVSNESLIB_HOME/devkitsnes/bin"
          make

      - name: Build ROM (fallback – skip 816-opt)
        if: steps.build.outcome == 'failure'
        env:
          PVSNESLIB_HOME: ${{ github.workspace }}/pvsneslib_install/pvsneslib
        run: |
          export PATH="$PATH:$PVSNESLIB_HOME/devkitsnes/bin"

          # Clean previous attempt
          make clean || true

          # Patch the rules so .ps is used directly instead of going through 816-opt
          # (avoids the "Out of 8-bit range" assembler error)
          sed -i 's|816-opt \$\*.ps >\$\*.asp|cp $*.ps $*.asp|' \
            "$PVSNESLIB_HOME/devkitsnes/snes_rules"

          make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pizzasnake-sfc
          path: pizzasnake.sfc
          if-no-files-found: error
          retention-days: 30

      - name: Upload intermediate files on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            *.asm
            *.ps
            *.asp
            *.obj
            Makefile
          if-no-files-found: ignore
